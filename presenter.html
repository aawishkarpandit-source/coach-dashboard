<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coach Dashboard — Stage (students see this)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; font-family: "Segoe UI", system-ui, Arial, sans-serif; }
  #idle {
    height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px; background: #fff;
  }
  #idle h1 { margin: 0; font-size: clamp(48px, 10vw, 120px); font-weight: 800; color: #111; letter-spacing: 2px; }
  #classPill {
    background: #16a34a; color: #fff; font-weight: 700;
    font-size: clamp(22px, 4vw, 44px); padding: 12px 64px; border-radius: 12px;
  }
  #content { display: none; height: 100vh; background: #000; }
  #content.show { display: block; }
  #content iframe, #content img, #content video { width: 100%; height: 100vh; border: 0; object-fit: contain; display: block; background: #000; }
  /* Offline PPTX slide: white canvas, slide scaled to fit, centered */
  #deckBox { width: 100%; height: 100vh; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #deckScale { transform-origin: center center; flex: none; }
  #err { display:none; color:#fff; background:#000; height:100vh; align-items:center; justify-content:center; font-size:22px; text-align:center; padding:40px; }
  /* Marksheet results (white page, clean table) */
  #marksBox { width: 100%; min-height: 100vh; background: #fff; color: #111; padding: 40px 48px; }
  #marksBox h2 { margin: 0 0 4px; font-size: clamp(26px, 4vw, 44px); }
  #marksBox .marks-sub { color: #6b7280; margin: 0 0 20px; font-size: clamp(14px, 2vw, 20px); }
  #marksBox table { width: 100%; border-collapse: collapse; font-size: clamp(15px, 2.2vw, 24px); }
  #marksBox th, #marksBox td { border-bottom: 2px solid #e5e7eb; padding: 10px 12px; text-align: left; }
  #marksBox thead th { background: #16a34a; color: #fff; }
  #marksBox thead th:first-child { border-radius: 10px 0 0 0; }
  #marksBox thead th:last-child { border-radius: 0 10px 0 0; }
</style>
</head>
<body>
  <!-- IDLE: white background, Welcome center, green Class pill below -->
  <div id="idle">
    <h1>Welcome</h1>
    <div id="classPill">Class 9A</div>
  </div>
  <div id="content"></div>
  <div id="err"></div>

<script>
'use strict';
// Single stage window for BOTH books and presentations.
// Receives {type,...} via postMessage from the teacher window,
// with a localStorage fallback ('coach-stage-msg') for file:// contexts.
(function () {
  const idle = document.getElementById('idle');
  const pill = document.getElementById('classPill');
  const content = document.getElementById('content');
  const err = document.getElementById('err');

  function showIdle(cls) {
    if (cls) pill.textContent = 'Class ' + cls;
    idle.style.display = 'flex'; content.classList.remove('show'); content.innerHTML = ''; err.style.display = 'none';
  }
  function showError(msg) {
    forgetVideo();
    idle.style.display = 'none'; content.classList.remove('show');
    err.style.display = 'flex'; err.textContent = msg;
  }
  function pdfSrc(url, page) {
    url = String(url).split('#')[0];
    // data: URLs must not get a #page fragment mangled — appending is still fine
    return url + '#page=' + (page || 1);
  }
  function escapeHtmlLite(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  // Non-marks content always plays on the black stage; marks use a white page.
  function stageBg(color) { content.style.background = color; }
  // Scale the fixed-size slide to fill the stage while preserving aspect ratio.
  function fitDeck(holder, w, h) {
    try {
      const box = document.getElementById('deckBox');
      const bw = box.clientWidth || window.innerWidth;
      const bh = box.clientHeight || window.innerHeight;
      const s = Math.min(bw / w, bh / h);
      holder.style.width = w + 'px';
      holder.style.height = h + 'px';
      holder.style.transform = 'scale(' + s + ')';
    } catch {}
  }
  window.addEventListener('resize', () => {
    const holder = document.getElementById('deckScale');
    if (holder && holder.firstElementChild) {
      const el = holder.firstElementChild;
      fitDeck(holder, el.offsetWidth || 1280, el.offsetHeight || 720);
    }
  });
  // Revoke previous object URL so long sessions don't leak memory.
  let lastObjUrl = '';
  let stageVideo = null; // the stage's player — teacher's screen is the master
  function fileUrl(msg) {
    if (msg.blob instanceof Blob) {
      if (lastObjUrl) { try { URL.revokeObjectURL(lastObjUrl); } catch {} }
      lastObjUrl = URL.createObjectURL(msg.blob);
      return lastObjUrl;
    }
    return msg.url || '';
  }
  function forgetVideo() { stageVideo = null; }
  function notifyTeacher(kind) {
    try { if (window.opener && !window.opener.closed) window.opener.postMessage({ __coachStageBack: kind }, '*'); } catch {}
  }
  // Browsers block autoplay WITH sound in a script-opened window.
  // Try with sound; fall back to muted motion + controls and tell the teacher.
  function tryPlay(v) {
    v.muted = false;
    let p = null;
    try { p = v.play(); } catch {}
    if (p && p.catch) p.catch(() => {
      try {
        v.muted = true; v.controls = true;
        const q = v.play(); if (q && q.catch) q.catch(() => {});
      } catch {}
      notifyTeacher('muted');
    });
  }
  function show(msg) {
    if (msg && msg.className) pill.textContent = 'Class ' + msg.className;
    err.style.display = 'none';
    if (!msg || msg.type === 'welcome' || msg.type === 'clear') { forgetVideo(); showIdle(msg && msg.className); return; }
    if (msg.type === 'video-sync') { syncVideo(msg); return; }
    const url = fileUrl(msg);
    if (!url) return; // metadata-only fallback arrived first; real content follows via postMessage
    idle.style.display = 'none'; content.classList.add('show'); stageBg('#000');
    if (msg.type === 'pdf') {
      forgetVideo();
      content.innerHTML = '';
      const f = document.createElement('iframe');
      f.src = pdfSrc(url, msg.page);
      f.onerror = () => showError('Could not display this PDF on the 2nd screen.');
      content.appendChild(f);
    } else if (msg.type === 'image') {
      forgetVideo();
      content.innerHTML = '';
      const img = document.createElement('img');
      img.src = url; img.onerror = () => showError('Could not display this image.');
      content.appendChild(img);
    } else if (msg.type === 'video') {
      content.innerHTML = '';
      const v = document.createElement('video');
      v.src = url; v.playsInline = true; v.controls = false;
      v.onerror = () => showError('Could not play this video.');
      content.appendChild(v);
      stageVideo = v;
      tryPlay(v);
    } else if (msg.type === 'embed') {
      forgetVideo();
      content.innerHTML = '';
      const f = document.createElement('iframe');
      f.src = url; f.allowFullscreen = true;
      f.setAttribute('allow', 'fullscreen; autoplay');
      f.style.background = '#fff';
      f.onerror = () => showError('Could not load this link (needs internet).');
      content.appendChild(f);
    } else if (msg.type === 'deck') {
      forgetVideo();
      if (!msg.html) return; // metadata-only fallback; full slide follows via postMessage
      idle.style.display = 'none'; content.classList.add('show');
      content.innerHTML = '<div id="deckBox"><div id="deckScale"></div></div>';
      const holder = document.getElementById('deckScale');
      holder.innerHTML = msg.html;
      fitDeck(holder, msg.w || 1280, msg.h || 720);
    } else if (msg.type === 'marks') {
      forgetVideo();
      idle.style.display = 'none'; content.classList.add('show'); stageBg('#fff');
      const rows = (msg.rows || []).map((r) =>
        '<tr><td>' + r.roll + '</td><td>' + escapeHtmlLite(r.name) + '</td><td>' + r.total + '</td><td>' + r.pct + '</td></tr>'
      ).join('') || '<tr><td colspan="4">No students</td></tr>';
      content.innerHTML = '<div id="marksBox"><h2>' + escapeHtmlLite(msg.title || 'Marksheet') +
        '</h2><p class="marks-sub">Class ' + escapeHtmlLite(msg.className || '') + '</p>' +
        '<table><thead><tr><th>Roll</th><th>Name</th><th>Total</th><th>Percent</th></tr></thead><tbody>' +
        rows + '</tbody></table></div>';
    }
  }
  function syncVideo(msg) {
    const v = stageVideo;
    if (!v) return;
    try {
      if (typeof msg.volume === 'number' && isFinite(msg.volume)) v.volume = Math.min(1, Math.max(0, msg.volume));
      if (typeof msg.rate === 'number' && isFinite(msg.rate) && msg.rate > 0) v.playbackRate = msg.rate;
      const wantMuted = !!msg.muted;
      if (v.muted !== wantMuted) v.muted = wantMuted;
      if (typeof msg.time === 'number' && isFinite(msg.time)) {
        const diff = Math.abs((v.currentTime || 0) - msg.time);
        if (diff > 0.8 && !v.seeking) { try { v.currentTime = msg.time; } catch {} }
      }
      if (msg.paused === false) {
        if (v.paused) { v.controls = false; tryPlay(v); }
      } else if (msg.paused === true) {
        if (!v.paused) { try { v.pause(); } catch {} }
      }
    } catch {}
  }
  window.addEventListener('message', (e) => { if (e.data && e.data.__coachStage) show(e.data); });
  window.addEventListener('storage', (e) => {
    if (e.key !== 'coach-stage-msg' || !e.newValue) return;
    try { const m = JSON.parse(e.newValue); if (m && m.__coachStage) show(m); } catch {}
  });
  // If opener wrote a message before we loaded, pick it up:
  try {
    const raw = localStorage.getItem('coach-stage-msg');
    if (raw) { const m = JSON.parse(raw); if (m && m.__coachStage) show(m); }
    else showIdle(localStorage.getItem('coach-class') || '9A');
  } catch { showIdle('9A'); }
})();
</script>
</body>
</html>
